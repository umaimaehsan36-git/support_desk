<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupportDesk - Customer Support Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container-xl d-flex justify-content-between align-items-center">
      <h1 class="h4 m-0">SupportDesk <small>Customer Support Dashboard</small></h1>
      <span class="badge text-bg-light" id="totalBadge">Total: 0</span>
    </div>
  </header>

  <main class="container-xl py-4">
    <!-- Ticket Summary (Part B) -->
    <section class="summary-grid mb-4" aria-label="Ticket summary">
      <div class="stat stat-open"><span id="sumOpen">0</span><p>Open</p></div>
      <div class="stat stat-progress"><span id="sumProgress">0</span><p>In Progress</p></div>
      <div class="stat stat-closed"><span id="sumClosed">0</span><p>Closed</p></div>
    </section>

    <div class="layout-grid">
      <!-- Ticket Form -->
      <aside class="card shadow-sm">
        <div class="card-body">
          <h2 class="h5" id="formTitle">New Ticket</h2>
          <form id="ticketForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Customer Name</label>
              <input type="text" id="name" class="form-control" placeholder="e.g. Hina Malik">
              <div class="invalid-feedback" id="nameError"></div>
            </div>
            <div class="mb-3">
              <label for="issue" class="form-label">Issue</label>
              <textarea id="issue" rows="3" class="form-control" placeholder="Describe the problem"></textarea>
              <div class="invalid-feedback" id="issueError"></div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="priority" class="form-label">Priority</label>
                <select id="priority" class="form-select">
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </div>
              <div class="col-6">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select">
                  <option value="Open" selected>Open</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Closed">Closed</option>
                </select>
              </div>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary" id="submitBtn">Add Ticket</button>
              <button type="button" class="btn btn-outline-secondary" id="resetBtn">Reset</button>
            </div>
          </form>
        </div>
      </aside>

      <!-- Ticket View -->
      <section>
        <div class="card shadow-sm mb-3">
          <div class="card-body">
            <h2 class="h6">Search &amp; Filter</h2>
            <div class="filter-grid">
              <input type="search" id="search" class="form-control" placeholder="Search issue keyword">
              <select id="filterStatus" class="form-select">
                <option value="">All Status</option>
                <option>Open</option><option>In Progress</option><option>Closed</option>
              </select>
              <select id="filterPriority" class="form-select">
                <option value="">All Priority</option>
                <option>Low</option><option>Medium</option><option>High</option>
              </select>
            </div>
          </div>
        </div>
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 m-0">Tickets</h2>
              <span class="badge text-bg-dark" id="showingBadge">Showing 0 of 0</span>
            </div>
            <div id="ticketList" class="ticket-grid"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
